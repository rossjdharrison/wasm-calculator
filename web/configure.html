<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0c0e" />
    <title>ROWBLAA LUXURY — Configure</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='84'>◆</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- tokens + engine component styles (the plain configurator used in journey downstream
         steps uses .qc-* classes); forced dark (data-theme) to match the always-dark showroom.
         Loaded BEFORE showroom.css so the showroom's own body/element rules win any overlap. -->
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="qc-base.css" />
    <link rel="stylesheet" href="showroom.css" />
  </head>
  <body>
    <!-- The configurator IS the showroom: showroom-view.mjs builds the full stage
         + glass rail into #app, driven by the live wasm engine. The model shown is
         chosen by ?m=<id> (see store.mjs), defaulting to vehicles. -->
    <div id="app"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
