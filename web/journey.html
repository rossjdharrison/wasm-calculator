<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Journey Loom</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" />
<style>
  :root{
    --ground:#0a0b0d; --panel:#0f1115; --raise:#14161b; --chip:#171a20;
    --line:rgba(216,162,74,.14); --line2:rgba(255,255,255,.06);
    --gold:#d8a24a; --gold-hi:#e6bd6e; --gold-soft:rgba(216,162,74,.12);
    --text:#ece8df; --dim:#9aa0a8; --faint:#5b616b; --steel:#7f9bb0; --ok:#74c2a2; --err:#cf5b41;
    --disp:"Fraunces",Georgia,serif; --ui:"Inter",system-ui,sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
    /* phase tints are set at runtime from the domain/journey phase data (--p-<id>); this is the neutral fallback */
    --p-default:#7f9bb0;
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--text);font-family:var(--ui);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer} .num{font-variant-numeric:tabular-nums}
  .jtop{display:flex;align-items:center;gap:16px;height:54px;padding:0 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0f1116,#0b0c10)}
  .jbrand{font-family:var(--disp);letter-spacing:.15em;font-size:14px}.jbrand b{color:var(--gold);font-weight:600}.jbrand em{color:var(--faint);font-style:normal;font-family:var(--ui);font-size:11px;letter-spacing:.03em;margin-left:4px}
  .jspacer{flex:1}
  .jbtn{border:1px solid var(--line2);border-radius:8px;padding:6px 11px;color:var(--dim);font-size:12px}.jbtn:hover{border-color:var(--gold);color:var(--gold)}
  .jshell{display:flex;height:calc(100vh - 55px)}
  .jstage{position:relative;flex:1;overflow:auto;background:radial-gradient(1100px 460px at 55% -10%, rgba(216,162,74,.05), transparent 62%), var(--ground)}
  .jbands{position:absolute;inset:0;display:flex;pointer-events:none}
  .jband{flex:1;border-right:1px dashed var(--line2);padding:12px}
  .jband .jband-l{font-family:var(--disp);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .jcanvas{position:relative;min-width:100%;min-height:100%}
  .jwires{position:absolute;inset:0;overflow:visible;pointer-events:none}
  .jnode{position:absolute;width:190px;border-radius:14px;background:var(--chip);border:1px solid var(--line2);border-left:3px solid var(--nc,var(--gold));padding:12px 14px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);transition:border-color .15s,box-shadow .15s}
  .jnode:hover{border-color:var(--gold)} .jnode.bad{border-color:var(--err)}
  .jnode .jn-role{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .jnode .jn-name{font-family:var(--disp);font-size:16px;margin:2px 0 6px}
  .jnode .jn-fig{font-family:var(--disp);font-size:15px;color:var(--gold)}
  .jnode .jn-drill{font-size:10px;color:var(--faint);margin-top:6px}
  .jedge{fill:none;stroke:var(--steel);stroke-width:1.6;opacity:.7}
  .jedge.trigger{stroke-dasharray:6 4;stroke:var(--gold)}
  .jedge:hover,.jedge.lit{opacity:1;stroke-width:2.4}
  .jelabel{fill:var(--dim);font-family:var(--ui);font-size:11px}
  .jhit{stroke:transparent;stroke-width:16;fill:none;cursor:pointer;pointer-events:stroke}
  .jlint{width:300px;flex:none;border-left:1px solid var(--line);background:linear-gradient(180deg,#0e1014,#0c0d11);overflow:auto;padding:12px 0}
  .jlint h5{margin:0;padding:8px 16px;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
  .jfind{padding:9px 16px;border-left:2px solid transparent;font-size:12px;color:var(--dim);cursor:pointer}
  .jfind:hover{background:var(--raise)}
  .jfind.error{border-left-color:var(--err)}.jfind.warn{border-left-color:var(--gold)}.jfind.info{border-left-color:var(--steel)}
  .jfind .jf-k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .jclean{padding:14px 16px;color:var(--ok);font-size:12px}
  .jpop{position:fixed;z-index:60;width:320px;background:rgba(18,20,25,.99);border:1px solid var(--line);border-radius:12px;padding:13px 15px;box-shadow:0 18px 50px -14px #000}
  .jpop h4{margin:0 0 3px;font-family:var(--disp);font-size:14px}.jpop .jp-k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .jpop .jp-contract{font-size:11px;color:var(--dim);margin-bottom:8px}.jpop .jp-contract code{font-family:var(--mono);color:var(--text)}
  .jpop .jlab{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:8px 0 4px}
  .jpop .jfx{width:100%;min-height:52px;resize:vertical;background:var(--ground);border:1px solid var(--line2);border-radius:7px;color:var(--text);padding:7px 9px;font-family:var(--mono);font-size:12px}
  .jpop .jfx:focus{outline:none;border-color:var(--gold)}.jpop .jfx.bad{border-color:var(--err)}
  .jpop .jsel{width:100%;background:var(--ground);border:1px solid var(--line2);border-radius:7px;color:var(--text);padding:6px 9px;font:inherit;font-size:12px}
  .jpop .jsel:focus{outline:none;border-color:var(--gold)}
  .jpop .del{border:1px solid var(--line2);color:#e79b8c}
  .jpop .jvmsg{font-size:11px;min-height:14px;margin-top:6px}.jpop .jvmsg.ok{color:var(--ok)}.jpop .jvmsg.bad{color:#e79b8c}
  .jpop .jrow{display:flex;gap:6px;margin-top:10px}.jpop .jrow button{flex:1;border-radius:8px;padding:7px;font-size:12px;font-weight:600}
  .jpop .save{background:var(--gold);color:#12130f}.jpop .save:disabled{opacity:.4}.jpop .cancel{border:1px solid var(--line2);color:var(--dim)}
  .jpop .close{position:absolute;top:9px;right:11px;color:var(--faint)}
  .jtoast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;background:rgba(18,20,25,.98);border:1px solid var(--line);border-radius:10px;padding:10px 15px;font-size:12.5px;box-shadow:0 16px 40px -14px #000}
  .jtoast b{color:var(--text);font-weight:500}.jtoast.err b{color:#e79b8c}
  .jboot{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-family:var(--disp);font-size:15px}
</style>
</head>
<body>
<div class="jtop">
  <div class="jbrand"><b>ROWBLAA</b> <em>· Journey Loom</em></div>
  <div class="jspacer"></div>
  <a class="jbtn" id="jstruct" href="#" title="Edit models, bindings & steps in forms">✎ Structure</a>
  <button class="jbtn" id="jundo" title="Undo">↺ Undo</button>
  <button class="jbtn" id="jreset" title="Reset to shipped journey">Reset</button>
</div>
<div class="jshell">
  <div class="jstage" id="jstage"><div class="jboot" id="jboot">Loading journey…</div></div>
  <aside class="jlint" id="jlint"></aside>
</div>
<div id="jpoplayer"></div>
<script type="module" src="./journey-loom.mjs"></script>
</body>
</html>
