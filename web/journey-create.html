<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Journey Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" />
<style>
  :root{
    --ground:#0a0b0d; --panel:#0f1115; --raise:#14161b; --chip:#171a20;
    --line:rgba(216,162,74,.14); --line2:rgba(255,255,255,.06);
    --gold:#d8a24a; --gold-hi:#e6bd6e;
    --text:#ece8df; --dim:#9aa0a8; --faint:#5b616b; --steel:#7f9bb0; --ok:#74c2a2; --err:#cf5b41;
    --disp:"Fraunces",Georgia,serif; --ui:"Inter",system-ui,sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
    --p-default:#7f9bb0; /* phase tints are set at runtime from phase data (--p-<id>) */
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--text);font-family:var(--ui);font-size:13px;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer} a{color:inherit}
  .num{font-variant-numeric:tabular-nums}
  .jtop{display:flex;align-items:center;gap:14px;height:54px;padding:0 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0f1116,#0b0c10);position:sticky;top:0;z-index:20}
  .jbrand{font-family:var(--disp);letter-spacing:.15em;font-size:14px}.jbrand b{color:var(--gold);font-weight:600}.jbrand em{color:var(--faint);font-style:normal;font-family:var(--ui);font-size:11px;letter-spacing:.03em;margin-left:4px}
  .jspacer{flex:1}
  .jbtn{border:1px solid var(--line2);border-radius:8px;padding:6px 11px;color:var(--dim);font-size:12px}.jbtn:hover{border-color:var(--gold);color:var(--gold)}
  .jbtn.primary{background:var(--gold);color:#12130f;border-color:var(--gold)}.jbtn.primary:disabled{opacity:.4}
  .jshell{display:flex;min-height:calc(100vh - 55px)}
  .jmain{flex:1;overflow:auto;padding:22px 26px;max-width:820px}
  .jside{width:300px;flex:none;border-left:1px solid var(--line);background:linear-gradient(180deg,#0e1014,#0c0d11);padding:12px 0;overflow:auto}
  h1{font-family:var(--disp);font-weight:600;font-size:24px;margin:0 0 4px}
  h2{font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.02em;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
  .sub{color:var(--dim);margin:0 0 8px}
  .lab{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:10px 0 4px}
  input.f,select.f,textarea.f{width:100%;background:var(--ground);border:1px solid var(--line2);border-radius:7px;color:var(--text);padding:7px 9px;font:inherit;font-size:12.5px}
  textarea.f{font-family:var(--mono);min-height:44px;resize:vertical}
  input.f:focus,select.f:focus,textarea.f:focus{outline:none;border-color:var(--gold)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .card{background:var(--chip);border:1px solid var(--line2);border-radius:11px;padding:11px 13px;margin-bottom:8px;border-left:3px solid var(--nc,var(--line2))}
  .card .ch{display:flex;align-items:center;gap:8px}
  .card .ct{font-family:var(--disp);font-size:14px}.card .cmeta{color:var(--dim);font-size:11px}
  .card .cx{margin-left:auto;color:var(--faint);border:1px solid var(--line2);border-radius:6px;padding:2px 7px;font-size:11px}.card .cx:hover{border-color:var(--err);color:#e79b8c}
  .mini{color:var(--faint);border:1px solid var(--line2);border-radius:6px;padding:2px 7px;font-size:11px;margin-left:6px}.mini:hover{border-color:var(--gold);color:var(--gold)}
  .addrow{display:flex;gap:8px;align-items:flex-end;margin-top:8px;flex-wrap:wrap}
  .addrow > div{flex:1;min-width:120px}
  .vmsg{font-size:11px;min-height:14px;margin:6px 0}.vmsg.ok{color:var(--ok)}.vmsg.bad{color:#e79b8c}
  .jlist{padding:0 4px}
  .jlist h5,.jside h5{margin:0;padding:8px 16px;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
  .jrow{display:flex;align-items:center;gap:6px;padding:7px 14px;border-left:2px solid transparent}
  .jrow:hover{background:var(--raise)}
  .jrow .jname{flex:1;font-size:12.5px}.jrow .jname small{color:var(--faint);display:block;font-size:10.5px}
  .jrow a,.jrow button{font-size:11px;color:var(--dim);border:1px solid var(--line2);border-radius:6px;padding:2px 7px}.jrow a:hover{border-color:var(--gold);color:var(--gold)}
  .find{padding:8px 16px;border-left:2px solid transparent;font-size:12px;color:var(--dim)}
  .find.error{border-left-color:var(--err)}.find.warn{border-left-color:var(--gold)}.find.info{border-left-color:var(--steel)}
  .find .fk{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .clean{padding:12px 16px;color:var(--ok);font-size:12px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;background:rgba(18,20,25,.98);border:1px solid var(--line);border-radius:10px;padding:10px 15px;font-size:12.5px}
  .toast b{font-weight:500}.toast.err b{color:#e79b8c}
  .boot{padding:40px;color:var(--dim);font-family:var(--disp);font-size:16px}
</style>
</head>
<body>
<div class="jtop">
  <div class="jbrand"><b>ROWBLAA</b> <em>· Journey Studio</em></div>
  <div class="jspacer"></div>
  <a class="jbtn" id="jc-canvas" href="#" title="Open the macro canvas">◱ Canvas</a>
  <a class="jbtn" id="jc-run" href="#" title="Run this journey">▶ Run</a>
  <button class="jbtn" id="jc-undo" title="Undo">↺ Undo</button>
  <button class="jbtn" id="jc-reset" title="Reset to shipped / delete draft">Reset</button>
</div>
<div class="jshell">
  <div class="jmain" id="jc-main"><div class="boot" id="jc-boot">Loading…</div></div>
  <aside class="jside" id="jc-side"></aside>
</div>
<div id="jc-toastlayer"></div>
<script type="module" src="./journey-create.mjs"></script>
</body>
</html>
